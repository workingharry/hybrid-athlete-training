name: HybridTrainingApp
options:
  bundleIdPrefix: com.vibe
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
packages:
  HybridTrainingEngine:
    path: ./HybridTrainingEngine
targets:
  HybridTrainingApp:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: HybridTrainingApp
    dependencies:
      - package: HybridTrainingEngine
        product: HybridTrainingCore
      - package: HybridTrainingEngine
        product: HybridTrainingStorage
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.vibe.HybridTrainingApp
        INFOPLIST_FILE: HybridTrainingApp/Resources/Info.plist
        CODE_SIGN_ENTITLEMENTS: HybridTrainingApp/Resources/HybridTrainingApp.entitlements
        GENERATE_INFOPLIST_FILE: NO
        SWIFT_VERSION: "5.9"
        CURRENT_PROJECT_VERSION: 1
        MARKETING_VERSION: "1.0.0"
        TARGETED_DEVICE_FAMILY: "1"
        ENABLE_PREVIEWS: YES
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: S452YTSQXZ
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
