name: ZeroTypingExpense
options:
  bundleIdPrefix: com.zerotyping
  deploymentTarget:
    iOS: 17.0
  xcodeVersion: "16.0"
settings:
  base:
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS: YES
    SWIFT_EMIT_LOC_STRINGS: YES
    CLANG_ANALYZER_LOCALIZABILITY_NONLOCALIZED: YES
    CLANG_WARN_QUOTED_INCLUDE_IN_FRAMEWORK_HEADER: YES
    RUN_CLANG_STATIC_ANALYZER: NO
targets:
  ZeroTypingExpense:
    type: application
    platform: iOS
    sources:
      - Sources/ZeroTypingExpense
    settings:
      base:
        PRODUCT_NAME: "零打字記帳"
        PRODUCT_BUNDLE_IDENTIFIER: com.zerotyping.expense
        INFOPLIST_KEY_CFBundleDisplayName: "零打字記帳"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        DEVELOPMENT_TEAM: "S452YTSQXZ"
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: "Apple Development"
        SWIFT_VERSION: "6.0"
        ENABLE_PREVIEWS: YES
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_NSPhotoLibraryUsageDescription: "用於每週檢查並清理已確認記帳的付款截圖"
        INFOPLIST_KEY_NSUserTrackingUsageDescription: "本 App 絕不上傳個人付款截圖，所有辨識於本機完成"
        ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS: YES
        ENABLE_USER_SCRIPT_SANDBOXING: YES
